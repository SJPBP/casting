<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div id="thumbnail">
      <img id="video-thumbnail" src="ilgaxfet02e3.jpg" alt="MasterChef India Season 9 - 6th February 2026 Thumbnail">
      <div id="media-options">
        <button id="backward-btn" class="round-circle medium">
        <i class="fa fa-backward"></i>
        </button>
      
        <button id="pause-play-btn" class="round-circle large">
          <i id="pause-play-btn-content" class="play-icon fa fa-play"></i>
        </button>
      
        <button id="forward-btn" class="round-circle medium">
        <i class="fa fa-forward"></i>
        </button>

      </div>

      <div class="control-panel">
        <div class="video-info">
          <div class="video-title">
            MasterChef India Season 9 - 6th February 2026
          </div>
          <div class="video-type">
            TV Show
          </div>
        </div>

        <div class="progress-container">
            <div class="playback-line">
            <div class="progress-bar"></div>
          </div>
        </div>

        <div class="timestamp">
          <div>
                <span id="current-time">00:00</span>
                <span id="separator">/</span>
                <span id="max-duration">00:00</span>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
